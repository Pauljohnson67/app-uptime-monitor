name: uptime
on:
  schedule:
      - cron: '*/5 * * * *'
        workflow_dispatch:
        permissions:
          contents: read
            issues: write
            concurrency:
              group: uptime
                cancel-in-progress: false
                jobs:
                  check:
                      runs-on: ubuntu-latest
                          steps:
                                - uses: actions/checkout@v4
                                      - name: Check endpoints
                                              id: check
                                                      run: |
                                                                set +e
                                                                          bash ./check-endpoints.sh
                                                                                    echo "status=$?" >> "$GITHUB_OUTPUT"
                                                                                          - name: Job summary
                                                                                                  if: always()
                                                                                                          run: cat report.md >> "$GITHUB_STEP_SUMMARY"
                                                                                                                - name: Alert on failure, close on recovery
                                                                                                                        if: always()
                                                                                                                                uses: actions/github-script@v7
                                                                                                                                        with:
                                                                                                                                                  script: |
                                                                                                                                                              const fs = require('fs');
                                                                                                                                                                          const failed = '${{ steps.check.outputs.status }}' !== '0';
                                                                                                                                                                                      const report = fs.existsSync('report.md') ? fs.readFileSync('report.md','utf8') : '(no report)';
                                                                                                                                                                                                  const LABEL = 'uptime-alert';
                                                                                                                                                                                                              const { owner, repo } = context.repo;
                                                                                                                                                                                                                          const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
                                                                                                                                                                                                                                      const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: LABEL })).data;
                                                                                                                                                                                                                                                  if (failed) {
                                                                                                                                                                                                                                                                if (open.length) {
                                                                                                                                                                                                                                                                                await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: 'Still failing. ' + runUrl });
                                                                                                                                                                                                                                                                                              } else {
                                                                                                                                                                                                                                                                                                              await github.rest.issues.create({ owner, repo, title: 'Uptime alert - endpoint down', labels: [LABEL], body: 'An automated uptime check failed. ' + runUrl });
                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                          core.setFailed('One or more endpoints are DOWN');
                                                                                                                                                                                                                                                                                                                                                      } else {
                                                                                                                                                                                                                                                                                                                                                                    for (const iss of open) {
                                                                                                                                                                                                                                                                                                                                                                                    await github.rest.issues.createComment({ owner, repo, issue_number: iss.number, body: 'Recovered - all endpoints healthy.' });
                                                                                                                                                                                                                                                                                                                                                                                                    await github.rest.issues.update({ owner, repo, issue_number: iss.number, state: 'closed' });
                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                              
